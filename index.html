<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>售后客服</title>
    <!-- 防淘宝屏蔽核心配置 -->
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="never">
    <style>
        /* 页面样式优化，客户体验更好 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f7fa;
            font-family: "微软雅黑", sans-serif;
            text-align: center;
            padding: 0 20px;
            margin-top: 60px;
        }
        .title { color: #333; font-size: 20px; margin-bottom: 20px; }
        .desc { color: #666; font-size: 16px; margin-bottom: 30px; }
        /* 核心按钮，强制触发跳转 */
        .add-btn {
            display: inline-block;
            padding: 16px 45px;
            background: #07c160;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(7, 193, 96, 0.3);
        }
        .add-btn:hover { background: #06b058; }
    </style>
</head>
<body>
    <h2 class="title">专属售后客服</h2>

    <a href="https://work.weixin.qq.com/ct/wcde60dba8ddd9d8d7d2db4db9d934142744" class="add-btn" target="_blank" rel="noopener noreferrer">
